        stroke="#3E2A56" stroke-width="4" stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <!-- ===== Wordmark ===== -->
  <text x="410" y="242"
        font-family="'Poppins','Nunito Sans','Segoe UI',system-ui,sans-serif"
