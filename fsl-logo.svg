        fill="none" stroke="#7B54A0" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="14 14"/>

  <!-- Mains : sommet, bas-gauche, bas-droite -->
  <use href="#hand" transform="translate(164 76) scale(0.75)"/>
  <use href="#hand" transform="translate(91 230) scale(0.75)"/>
  <use href="#hand" transform="translate(237 230) scale(0.75)"/>

