  <!-- Arc plein (haut, gauche, bas) -->
  <path d="M 322.8 105.5 A 158 158 0 1 0 322.8 314.5"
        fill="none" stroke="#7B54A0" stroke-width="4" stroke-linecap="round"/>
  <!-- Arc pointillé (côté droit) -->
